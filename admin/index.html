<!doctype html>
<html lang="it">
<head>

  <title>Area riservata | Agriturismo Giuggioloni</title>
  <link rel="stylesheet" href="/admin/editor.css">

</head>
<body>

      <p>Agriturismo Giuggioloni</p>
      <h1>Area riservata</h1>
